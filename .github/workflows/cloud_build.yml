name: Cloud Build — APK · Windows EXE · macOS App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

  # ── Release: push any tag starting with v (e.g. v1.0.0) ──────────────────
  # Jobs run first; the release job waits for all three to finish.

jobs:
  # ════════════════════════════════════════════════════════════
  # JOB 1 — Android APK  (ubuntu-latest)
  # ════════════════════════════════════════════════════════════
  build-android:
    name: "🤖 Android APK"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Ensure assets directory
        run: mkdir -p assets/images && touch assets/images/.gitkeep

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-name="${{ github.ref_name == '' && '1.0.0' || github.ref_name }}" \
            --build-number=${{ github.run_number }}

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
             artifacts/SportsAnalyzerAI-${{ github.run_number }}-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: frontend/artifacts/SportsAnalyzerAI-${{ github.run_number }}-release.apk
          retention-days: 90

  # ════════════════════════════════════════════════════════════
  # JOB 2 — Windows EXE  (windows-latest)
  # ════════════════════════════════════════════════════════════
  build-windows:
    name: "🖥️ Windows EXE"
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Ensure assets directory
        run: |
          New-Item -ItemType Directory -Force -Path assets\images | Out-Null
          New-Item -ItemType File -Force -Path assets\images\.gitkeep | Out-Null

      - name: Flutter pub get
        run: flutter pub get

      - name: Build Windows release
        run: |
          flutter build windows --release `
            --build-name="${{ github.ref_name == '' && '1.0.0' || github.ref_name }}" `
            --build-number=${{ github.run_number }}

      - name: Zip Windows bundle
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "..\SportsAnalyzerAI-Windows-${{ github.run_number }}.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: SportsAnalyzerAI-Windows-${{ github.run_number }}.zip
          retention-days: 90

  # ════════════════════════════════════════════════════════════
  # JOB 3 — macOS App  (macos-latest)
  # ════════════════════════════════════════════════════════════
  build-macos:
    name: "🍎 macOS App"
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Ensure assets directory
        run: mkdir -p assets/images && touch assets/images/.gitkeep

      - name: Flutter pub get
        run: flutter pub get

      - name: Build macOS release
        run: |
          flutter build macos --release \
            --build-name="${{ github.ref_name == '' && '1.0.0' || github.ref_name }}" \
            --build-number=${{ github.run_number }}

      - name: Package as DMG
        run: |
          APP_PATH="build/macos/Build/Products/Release/sports_analyzer_ai.app"
          DMG_NAME="SportsAnalyzerAI-macOS-${{ github.run_number }}.dmg"
          hdiutil create \
            -volname "Sports Analyzer AI" \
            -srcfolder "$APP_PATH" \
            -ov -format UDZO \
            "../$DMG_NAME"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: SportsAnalyzerAI-macOS-${{ github.run_number }}.dmg
          retention-days: 90

  # ════════════════════════════════════════════════════════════
  # JOB 4 — GitHub Release  (runs ONLY on v* tag push)
  # ════════════════════════════════════════════════════════════
  release:
    name: "🚀 Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [build-android, build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List artifacts
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sports Analyzer AI ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Sports Analyzer AI — ${{ github.ref_name }}

            > Cross-platform athletic vision analysis for Volleyball, Kabaddi & Kho Kho.

            ### 📦 Download

            | Platform | File | Notes |
            |----------|------|-------|
            | 🤖 Android | `SportsAnalyzerAI-*-release.apk` | Sideload on Android 6+ |
            | 🖥️ Windows | `SportsAnalyzerAI-Windows-*.zip` | Extract & run `.exe` |
            | 🍎 macOS | `SportsAnalyzerAI-macOS-*.dmg` | Mount & drag to Applications |

            ### ✨ Features
            - YOLOv8 player detection + 17-keypoint biomechanics (2D/3D)
            - Volleyball, Kabaddi & Kho Kho rule engines
            - Court homography & heatmaps
            - AI chatbot (offline RAG)
            - Match reports, CSV/JSON/HTML export & video replay scrubber
            - Hardware auto-profiling (CPU / CUDA / DirectML)
          files: release-assets/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
