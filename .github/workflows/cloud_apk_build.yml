name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # 1. Download repository source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Install Java for Android Gradle builds
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Install Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.7'
          cache: true
          cache-dependency-path: frontend/pubspec.lock

      # 4. Display environment versions
      - name: Check Flutter and Java
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      # 5. Verify project files
      - name: Check Flutter project
        run: |
          test -f pubspec.yaml || {
            echo "ERROR: frontend/pubspec.yaml not found"
            exit 1
          }

          test -f android/settings.gradle -o \
               -f android/settings.gradle.kts || {
            echo "ERROR: Android settings.gradle file not found"
            exit 1
          }

          test -f android/app/build.gradle -o \
               -f android/app/build.gradle.kts || {
            echo "ERROR: Android app Gradle file not found"
            exit 1
          }

      # 6. Download Flutter dependencies
      - name: Install Flutter dependencies
        run: flutter pub get

      # 7. Check Dart code
      - name: Analyze Flutter project
        run: dart analyze --fatal-infos
        continue-on-error: true

      # 8. Build release APK
      - name: Build release APK
        run: flutter build apk --release

      # 9. Upload the generated APK
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sports-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

