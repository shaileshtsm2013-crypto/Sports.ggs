name: Build Android APK in Cloud

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Install Dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Patch Android Repositories if Missing
        working-directory: frontend/android
        run: |
          python3 -c '
          import os
          build_gradle_path = "build.gradle"
          if os.path.exists(build_gradle_path):
              with open(build_gradle_path, "r") as f:
                  content = f.read()
              if "google()" not in content:
                  print("Injecting google() and mavenCentral() repositories...")
                  content += "\nallprojects {\n    repositories {\n        google()\n        mavenCentral()\n    }\n}\n"
                  with open(build_gradle_path, "w") as f:
                      f.write(content)
          '

      - name: Build Release APK
        working-directory: frontend
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk