name: Build Flutter APK & Windows EXE

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Android APK (Release + Debug)
  # ─────────────────────────────────────────
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create placeholder assets directory
        run: mkdir -p assets/images

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Run Flutter tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug --no-shrink

      - name: Build release APK
        run: flutter build apk --release

      - name: Build App Bundle (AAB) for Play Store
        run: flutter build appbundle --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SportsAnalyzerAI-debug
          path: frontend/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: SportsAnalyzerAI-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: SportsAnalyzerAI-release-aab
          path: frontend/build/app/outputs/bundle/release/app-release.aab
          retention-days: 90

      - name: Get APK size
        run: |
          echo "## Build Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| app-debug.apk | $(du -sh build/app/outputs/flutter-apk/app-debug.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| app-release.apk | $(du -sh build/app/outputs/flutter-apk/app-release.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
          echo "| app-release.aab | $(du -sh build/app/outputs/bundle/release/app-release.aab | cut -f1) |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 2: Windows EXE (PyInstaller Backend)
  # ─────────────────────────────────────────
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build Windows EXE with PyInstaller
        run: |
          python -m PyInstaller `
            --noconfirm `
            --onedir `
            --name SportsAnalyzerAI `
            --add-data "backend/app/static;backend/app/static" `
            --add-data "backend/app/analytics;backend/app/analytics" `
            --add-data "backend/app/api;backend/app/api" `
            --add-data "backend/app/core;backend/app/core" `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols `
            --hidden-import uvicorn.protocols.http `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan `
            --hidden-import uvicorn.lifespan.on `
            --hidden-import sqlalchemy.dialects.sqlite `
            --collect-all onnxruntime `
            run_desktop.py

      - name: Create installer directory
        run: |
          New-Item -ItemType Directory -Force -Path dist\installer
          Copy-Item -Recurse dist\SportsAnalyzerAI dist\installer\

      - name: Create README for release
        run: |
          @"
          # Sports Analyzer AI - Windows Release
          
          ## Running the App
          1. Open the `SportsAnalyzerAI` folder
          2. Double-click `SportsAnalyzerAI.exe`
          3. The web dashboard will open automatically at http://127.0.0.1:8000/app
          
          ## Requirements
          - Windows 10 / 11 (64-bit)
          - A webcam for live analysis (optional)
          "@ | Out-File -FilePath dist\README.txt -Encoding utf8

      - name: Zip the EXE bundle
        run: |
          Compress-Archive -Path dist\SportsAnalyzerAI -DestinationPath dist\SportsAnalyzerAI-Windows-x64.zip

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsAnalyzerAI-Windows-x64
          path: dist\SportsAnalyzerAI-Windows-x64.zip
          retention-days: 90

      - name: Build summary
        run: |
          Write-Output "## Windows Build" >> $env:GITHUB_STEP_SUMMARY
          $size = (Get-Item "dist\SportsAnalyzerAI-Windows-x64.zip").Length / 1MB
          Write-Output "| File | Size |" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "|------|------|" >> $env:GITHUB_STEP_SUMMARY
          Write-Output "| SportsAnalyzerAI-Windows-x64.zip | $([math]::Round($size, 1)) MB |" >> $env:GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────
  # JOB 3: Flutter Windows Desktop EXE
  # ─────────────────────────────────────────
  build-flutter-windows:
    name: Build Flutter Windows Desktop EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Create placeholder assets
        run: New-Item -ItemType Directory -Force -Path assets\images

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip Windows Flutter build
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release `
            -DestinationPath ..\dist-flutter-windows.zip

      - name: Upload Flutter Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsAnalyzerAI-Flutter-Windows
          path: dist-flutter-windows.zip
          retention-days: 90

  # ─────────────────────────────────────────
  # JOB 4: Create GitHub Release (on tag push)
  # ─────────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [ build-apk, build-windows-exe, build-flutter-windows ]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sports Analyzer AI ${{ github.ref_name }}"
          body: |
            ## Sports Analyzer AI — ${{ github.ref_name }}
            
            ### Downloads
            | Platform | File | Notes |
            |----------|------|-------|
            | 🤖 Android | `app-release.apk` | Sideload on Android 6+ |
            | 🤖 Android | `app-release.aab` | Google Play Store bundle |
            | 🖥️ Windows (Backend) | `SportsAnalyzerAI-Windows-x64.zip` | Full backend + web dashboard |
            | 🖥️ Windows (Flutter) | `SportsAnalyzerAI-Flutter-Windows.zip` | Native Flutter desktop UI |
            
            ### Features
            - Live volleyball / kabaddi / kho kho tracking
            - 17-keypoint biomechanics (2D/3D pose estimation)
            - Court homography & heatmaps
            - AI chatbot (offline RAG)
            - Match reports & video replay
          files: |
            release-assets/**/*.apk
            release-assets/**/*.aab
            release-assets/**/*.zip
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
