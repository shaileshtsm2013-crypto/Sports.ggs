workflows:
  android-apk:
    name: Android APK Build
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.24.5
      java: 17

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Create assets directory
        script: |
          mkdir -p frontend/assets/images
          touch frontend/assets/images/.gitkeep

      - name: Get Flutter packages
        script: |
          cd frontend
          flutter pub get

      - name: Build debug APK
        script: |
          cd frontend
          flutter build apk \
            --debug \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

      - name: Build release APK
        script: |
          cd frontend
          flutter build apk \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

      - name: Build App Bundle (AAB)
        script: |
          cd frontend
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER

      - name: Rename artifacts
        script: |
          mv frontend/build/app/outputs/flutter-apk/app-debug.apk \
             frontend/build/app/outputs/flutter-apk/SportsAnalyzerAI-debug.apk
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
             frontend/build/app/outputs/flutter-apk/SportsAnalyzerAI-release.apk
          mv frontend/build/app/outputs/bundle/release/app-release.aab \
             frontend/build/app/outputs/bundle/release/SportsAnalyzerAI-release.aab

    artifacts:
      - frontend/build/app/outputs/flutter-apk/SportsAnalyzerAI-debug.apk
      - frontend/build/app/outputs/flutter-apk/SportsAnalyzerAI-release.apk
      - frontend/build/app/outputs/bundle/release/SportsAnalyzerAI-release.aab

    publishing:
      email:
        recipients:
          - your@email.com     # ← change to your email
        notify:
          success: true
          failure: true
