workflows:
  android-apk:
    name: "🤖 Android APK — Release"
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      flutter: 3.24.5
      java: 17

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Set up assets directory
        script: |
          mkdir -p frontend/assets/images
          touch frontend/assets/images/.gitkeep

      - name: Flutter pub get
        script: |
          cd frontend
          flutter pub get

      - name: Build release APK
        script: |
          cd frontend
          flutter build apk \
            --release \
            --android-skip-build-dependency-validation \
            --build-name=${CM_TAG:-1.0.$BUILD_NUMBER} \
            --build-number=$BUILD_NUMBER

      - name: Build release AAB (Play Store)
        script: |
          cd frontend
          flutter build appbundle \
            --release \
            --android-skip-build-dependency-validation \
            --build-name=${CM_TAG:-1.0.$BUILD_NUMBER} \
            --build-number=$BUILD_NUMBER

      - name: Rename artifacts
        script: |
          TAG=${CM_TAG:-build-$BUILD_NUMBER}
          mv frontend/build/app/outputs/flutter-apk/app-release.apk \
             frontend/build/app/outputs/flutter-apk/SportsAnalyzerAI-${TAG}-release.apk
          mv frontend/build/app/outputs/bundle/release/app-release.aab \
             frontend/build/app/outputs/bundle/release/SportsAnalyzerAI-${TAG}-release.aab

    artifacts:
      - frontend/build/app/outputs/flutter-apk/SportsAnalyzerAI-*-release.apk
      - frontend/build/app/outputs/bundle/release/SportsAnalyzerAI-*-release.aab

    publishing:
      email:
        recipients:
          - shaileshtsm2013@gmail.com
        notify:
          success: true
          failure: true
